# One command for everything:  docker compose up --build   ->   http://localhost:8000
services:
  nomadgrid:
    build:
      context: .
      args:
        WITH_UI: "true"          # "false" = API-only image (no Node build)
    image: nomadgrid
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - nomadgrid-db:/app/storage   # reservations survive restarts
    read_only: true                 # the container filesystem is immutable ...
    tmpfs:
      - /tmp                        # ... except scratch space and the database volume
    restart: unless-stopped

volumes:
  nomadgrid-db:
